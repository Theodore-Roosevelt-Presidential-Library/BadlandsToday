name: Refresh data and deploy

# Hourly: pull park alerts, river, weather and air into data/today.json and publish the site.
# today.json is built fresh on every deploy and is NOT committed (keeps the history clean).
# things.json, new card thumbnails and visitation.json are committed when they change (rare).

on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: node scripts/build.mjs
      - name: Card thumbnails for any new NPS activities
        run: |
          pip install --quiet pillow
          python3 scripts/thumbs.py
      - name: Commit slow-changing data if it changed
        run: |
          git config user.name "badlands-today-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/things.json data/visitation.json assets/things
          if git diff --cached --quiet; then echo "No slow-data changes"; else
            git commit -m "Update NPS activities/visitation $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
